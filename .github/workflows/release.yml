name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../sqlite-to-xlsx-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz sqlite-to-xlsx

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../sqlite-to-xlsx-${{ github.ref_name }}-${{ matrix.arch }}.zip sqlite-to-xlsx.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-to-xlsx-${{ matrix.arch }}
          path: sqlite-to-xlsx-${{ github.ref_name }}-${{ matrix.arch }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
